<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- [수정] user-scalable=no, maximum-scale 제거 (접근성) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행용 양방향 번역기</title>

  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="여행번역기">

  <!-- [추가] CSP: 허용 출처 제한. 적용 후 OCR이 동작하는지 꼭 테스트하세요. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net;
             connect-src https://api.mymemory.translated.net https://open.er-api.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com;
             img-src 'self' blob: data:;
             worker-src blob: https://cdn.jsdelivr.net;
             style-src 'self' 'unsafe-inline'">

  <!-- [수정] 버전 고정(5.1.1). SRI 해시는 srihash.org 에서 이 URL로 생성한 뒤
       태그에 integrity="sha384-해시값" 속성을 추가하세요. -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"
          crossorigin="anonymous"></script>

  <style>
    :root {
      --primary: #007aff;
      --success: #34c759;
      --warning: #ff9500;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --subtext: #8e8e93;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 16px;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    h2 { font-size: 20px; margin-top: 8px; margin-bottom: 16px; text-align: center; }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

    select, input[type="number"] {
      width: 100%; padding: 12px; font-size: 16px; font-weight: 600;
      border-radius: 12px; border: 1px solid #e5e5ea; background: #f8f9fa;
      color: var(--text); margin-top: 4px; box-sizing: border-box;
    }

    button {
      width: 100%; padding: 16px; font-size: 17px; font-weight: 700;
      border-radius: 12px; border: none; cursor: pointer; color: white;
      margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    button:active { opacity: 0.8; }
    .btn-my { background: var(--primary); }
    .btn-target { background: var(--success); }
    .btn-camera { background: var(--warning); }

    .result-box {
      margin-top: 12px; padding: 14px; background: #f8f9fa;
      border-radius: 12px; border: 1px solid #e5e5ea;
    }

    .input-text { font-size: 13px; color: var(--subtext); margin-bottom: 6px; word-break: break-all; }

    .translated-text {
      font-size: 20px; font-weight: 700; color: #000000;
      line-height: 1.3; word-break: break-word; margin-bottom: 6px;
    }

    .error-text { color: #d70015; }

    .eur-display {
      font-size: 32px; font-weight: 800; color: #007aff; text-align: center; margin: 8px 0;
    }
    .krw-display {
      font-size: 22px; font-weight: 700; color: #34c759; text-align: center;
    }

    /* [추가] 숫자 자동 인식 확인 안내 */
    .number-notice {
      display: none; margin-top: 8px; padding: 8px 10px; border-radius: 8px;
      background: #fff4e5; color: #8a5300; font-size: 13px; font-weight: 600; text-align: center;
    }

    .action-bar { display: flex; gap: 8px; margin-top: 8px; }
    .btn-action {
      background: #e5e5ea; color: #1c1c1e; padding: 10px; font-size: 14px;
      font-weight: 600; border-radius: 8px; margin-top: 0; flex: 1;
    }

    .phrase-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .phrase-btn {
      background: #e5e5ea; color: var(--text); padding: 12px 10px;
      font-size: 14px; font-weight: 600; border-radius: 10px; text-align: left; margin-top: 0;
    }

    #imagePreview {
      width: 100%; max-height: 200px; object-fit: contain; border-radius: 10px; margin-top: 10px; display: none;
    }
    /* [추가] 음성/오류 안내 토스트 */
    .toast {
      position: fixed; left: 16px; right: 16px; bottom: 20px; padding: 12px 14px;
      background: rgba(28,28,30,0.92); color: #fff; font-size: 14px; font-weight: 600;
      border-radius: 12px; text-align: center; display: none; z-index: 10;
    }
  </style>
</head>
<body>

  <h2>✈️ 스페인 & 포르투 프리미엄 번역기</h2>

  <!-- 1. 상대방 언어 선택 -->
  <div class="card">
    <div class="card-title">🌐 상대방 언어 선택</div>
    <select id="langSelect">
      <option value="es">🇪🇸 스페인어 (Spain)</option>
      <option value="pt">🇵🇹 포르투갈어 (Portugal)</option>
      <option value="en" selected>🇬🇧 영어 (English)</option>
    </select>
  </div>

  <!-- 2. 내가 말하기 -->
  <div class="card">
    <div class="card-title">🇰🇷 내가 말하기 (한국어)</div>
    <button class="btn-my" onclick="startSpeechMy()">🎤 말하기 시작</button>
    <div class="result-box">
      <div id="myInput" class="input-text">한국어로 말씀하시면 번역 및 음성 재생됩니다.</div>
      <div id="myOutput" class="translated-text"></div>
      <div class="action-bar" id="myActionBar" style="display:none;">
        <button class="btn-action" onclick="replayMySpeech()">🔊 다시 들려주기</button>
      </div>
    </div>
  </div>

  <!-- 3. 상대방 말하기 (음성 감지) -->
  <div class="card">
    <div class="card-title">🎧 상대방 말하기 (자동 감지)</div>
    <button class="btn-target" onclick="startSpeechTargetAuto()">🎧 상대방 말 듣기</button>
    <div class="result-box">
      <div id="targetInput" class="input-text">상대방이 말할 때 버튼을 누르세요.</div>
      <div id="targetOutput" class="translated-text"></div>
      <div class="action-bar" id="targetActionBar" style="display:none;">
        <button class="btn-action" onclick="replayTargetSpeech()">🔊 한국어로 다시 듣기</button>
      </div>
    </div>
  </div>

  <!-- 4. 유로 환율 계산기 -->
  <div class="card">
    <div class="card-title">💶 유로(€) 실시간 계산기</div>
    <input type="number" id="eurInput" placeholder="유로 금액 입력 (예: 25.5)" oninput="onManualEurInput()">
    <div class="result-box" style="text-align: center;">
      <div id="eurDisplay" class="eur-display">€ 0</div>
      <div id="krwDisplay" class="krw-display">약 0 원</div>
      <div id="numberNotice" class="number-notice">⚠️ 음성에서 자동 인식된 숫자입니다. 실제 금액과 맞는지 꼭 확인하세요.</div>
      <div id="exchangeRateInfo" class="input-text" style="margin-top:6px;">환율 정보 로딩 중...</div>
    </div>
  </div>

  <!-- 5. 메뉴판/표지판 촬영 번역 (OCR) -->
  <div class="card">
    <div class="card-title">📷 메뉴판 / 표지판 촬영 번역</div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="processImage(this)">
    <button class="btn-camera" onclick="document.getElementById('cameraInput').click()">📷 카메라로 촬영 / 사진 선택</button>
    <img id="imagePreview" alt="미리보기">
    <div class="result-box">
      <div id="ocrStatus" class="input-text">사진을 촬영하거나 선택하면 글자를 인식합니다.</div>
      <div id="ocrOutput" class="translated-text"></div>
    </div>
  </div>

  <!-- 6. 오프라인 필수 표현 -->
  <div class="card">
    <div class="card-title">⚡ 오프라인 필수 표현 (비상용)</div>
    <div class="phrase-grid">
      <button class="phrase-btn" onclick="playPhrase('감사합니다')">🙏 감사합니다</button>
      <button class="phrase-btn" onclick="playPhrase('얼마인가요?')">💰 얼마인가요?</button>
      <button class="phrase-btn" onclick="playPhrase('화장실 어디예요?')">🚻 화장실 위치</button>
      <button class="phrase-btn" onclick="playPhrase('메뉴판 주세요')">🍽️ 메뉴판 요청</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // [추가] MyMemory 하루 한도: 익명 약 5,000자 / 이메일 등록 시 약 50,000자
    // 본인 이메일을 넣으면 한도가 10배로 늘어납니다. (이메일은 MyMemory로 전송됩니다)
    const MYMEMORY_EMAIL = "";
    const MAX_OCR_CHARS = 2000;   // 사진 1장당 번역할 최대 글자 수
    const CHUNK_LEN = 250;        // MyMemory 요청당 500바이트 제한 → 안전하게 분할
    const translationCache = new Map();

    const langMap = { es: 'es-ES', pt: 'pt-PT', en: 'en-US', ko: 'ko-KR' };
    const offlineDict = {
      // [수정] 스페인어 '메뉴판'을 계산서(La cuenta)에서 메뉴판(La carta)으로 변경
      es: { '감사합니다': 'Gracias', '얼마인가요?': '¿Cuánto cuesta?', '화장실 어디예요?': '¿Dónde está el baño?', '메뉴판 주세요': 'La carta, por favor' },
      pt: { '감사합니다': 'Obrigado', '얼마인가요?': 'Quanto custa?', '화장실 어디예요?': 'Onde fica o banheiro?', '메뉴판 주세요': 'A ementa, por favor' },
      en: { '감사합니다': 'Thank you', '얼마인가요?': 'How much is it?', '화장실 어디예요?': 'Where is the bathroom?', '메뉴판 주세요': 'Menu, please' }
    };

    const DEFAULT_RATE = 1480;       // 기본 예비 환율
    const RATE_MIN = 1000;           // [추가] 환율 정상 범위
    const RATE_MAX = 3000;
    let eurToKrwRate = DEFAULT_RATE;
    let lastMyTranslated = "", lastMyLang = "", lastTargetTranslated = "";
    let currentPreviewUrl = null;

    // 환율 가져오기 + [추가] 값 검증
    async function fetchExchangeRate() {
      const info = document.getElementById('exchangeRateInfo');
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/EUR');
        const data = await res.json();
        const rate = Number(data && data.rates && data.rates.KRW);
        if (Number.isFinite(rate) && rate >= RATE_MIN && rate <= RATE_MAX) {
          eurToKrwRate = rate;
          info.innerText = `현재 적용 환율: 1€ = ${Math.round(rate).toLocaleString()}원`;
        } else {
          info.innerText = `환율 응답이 비정상이라 기본 환율을 사용합니다: 1€ = ${DEFAULT_RATE}원`;
        }
      } catch (e) {
        info.innerText = `기본 적용 환율: 1€ = ${DEFAULT_RATE}원 (오프라인 모드)`;
      }
      calculateExchange();
    }
    fetchExchangeRate();

    function calculateExchange() {
      const val = parseFloat(document.getElementById('eurInput').value) || 0;
      const krw = Math.round(val * eurToKrwRate);
      document.getElementById('eurDisplay').innerText = `€ ${val.toLocaleString()}`;
      document.getElementById('krwDisplay').innerText = `약 ${krw.toLocaleString()} 원`;
    }

    // [추가] 사용자가 직접 입력하면 자동 인식 경고 숨김
    function onManualEurInput() {
      document.getElementById('numberNotice').style.display = 'none';
      calculateExchange();
    }

    function getSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("이 브라우저는 음성 인식을 지원하지 않습니다.");
        return null;
      }
      return new SpeechRecognition();
    }

    function showError(el, message) {
      el.innerText = message;
      el.classList.add('error-text');
    }

    function showResult(el, message) {
      el.innerText = message;
      el.classList.remove('error-text');
    }

    // 내가 말하기
    function startSpeechMy() {
      const recognition = getSpeechRecognition();
      if (!recognition) return;

      unlockSpeech();
      recognition.lang = 'ko-KR';
      recognition.interimResults = false;
      recognition.start();

      const out = document.getElementById('myOutput');
      document.getElementById('myInput').innerText = "듣고 있는 중...";
      showResult(out, "");
      document.getElementById('myActionBar').style.display = "none";

      recognition.onerror = () => {
        document.getElementById('myInput').innerText = "음성을 인식하지 못했습니다. 다시 시도해 주세요.";
      };

      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('myInput').innerText = `나: "${text}"`;

        const targetLang = document.getElementById('langSelect').value;
        const result = await translateText(text, 'ko', targetLang);

        // [수정] 오류 메시지는 음성으로 읽지 않음
        if (!result.ok) {
          showError(out, result.text);
          return;
        }

        lastMyTranslated = result.text;
        lastMyLang = langMap[targetLang];

        showResult(out, result.text);
        document.getElementById('myActionBar').style.display = "flex";
        speak(result.text, lastMyLang);
      };
    }

    // 상대방 말하기
    function startSpeechTargetAuto() {
      const recognition = getSpeechRecognition();
      if (!recognition) return;

      unlockSpeech();
      recognition.lang = langMap[document.getElementById('langSelect').value] || 'en-US';
      recognition.interimResults = false;
      recognition.start();

      const out = document.getElementById('targetOutput');
      document.getElementById('targetInput').innerText = "상대방 언어 감지 및 듣는 중...";
      showResult(out, "");
      document.getElementById('targetActionBar').style.display = "none";

      recognition.onerror = () => {
        document.getElementById('targetInput').innerText = "음성을 인식하지 못했습니다. 다시 시도해 주세요.";
      };

      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('targetInput').innerText = `상대방 입력: "${text}"`;

        // 숫자 인지 시 환율 카드에 입력하되, [수정] 확인 안내를 함께 표시
        const numbers = text.match(/\d+(\.\d+)?/g);
        if (numbers && numbers.length > 0) {
          document.getElementById('eurInput').value = numbers[0];
          calculateExchange();
          document.getElementById('numberNotice').style.display = 'block';
        }

        const result = await translateWithAutoDetect(text, 'ko');

        if (!result.ok) {
          showError(out, result.translatedText);
          return;
        }

        const langNames = { es: '🇪🇸 스페인어', pt: '🇵🇹 포르투갈어', en: '🇬🇧 영어' };
        const detectedName = langNames[result.detectedLang] || `🌐 ${String(result.detectedLang).toUpperCase()}`;

        lastTargetTranslated = result.translatedText;

        showResult(out, `[${detectedName}]\n${result.translatedText}`);
        document.getElementById('targetActionBar').style.display = "flex";
        speak(result.translatedText, 'ko-KR');
      };
    }

    // ---------- 번역 (MyMemory) ----------
    function quotaMessage() {
      return MYMEMORY_EMAIL
        ? "오늘 무료 번역 한도를 모두 사용했습니다. 내일 다시 시도해 주세요."
        : "오늘 무료 번역 한도(익명 약 5,000자)를 모두 사용했습니다. 코드 상단 MYMEMORY_EMAIL에 이메일을 넣으면 한도가 약 10배로 늘어납니다.";
    }

    async function mmTranslate(text, from, to) {
      const key = `${from}|${to}|${text}`;
      if (translationCache.has(key)) return translationCache.get(key);
      try {
        let url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
        if (MYMEMORY_EMAIL) url += `&de=${encodeURIComponent(MYMEMORY_EMAIL)}`;
        const res = await fetch(url);
        const data = await res.json();
        const status = Number(data.responseStatus);
        const translated = data.responseData && data.responseData.translatedText;
        const raw = `${translated || ''} ${data.responseDetails || ''}`;
        if (status === 429 || /ALL AVAILABLE FREE TRANSLATIONS|MYMEMORY WARNING/i.test(raw)) {
          return { ok: false, quota: true, text: quotaMessage() };
        }
        if (status !== 200 || !translated) {
          return { ok: false, text: "번역 서비스 오류입니다. 잠시 후 다시 시도해 주세요." };
        }
        const result = { ok: true, text: translated, detectedLang: (data.responseData && data.responseData.detectedLanguage) || 'en' };
        translationCache.set(key, result);
        return result;
      } catch (err) {
        return { ok: false, text: "번역 오류가 발생했습니다. 네트워크를 확인해 주세요." };
      }
    }

    async function translateText(text, from, to) {
      if (!navigator.onLine) {
        const dict = offlineDict[to] || {};
        if (dict[text]) return { ok: true, text: dict[text] };
        return { ok: false, text: "오프라인 상태입니다. 아래 '오프라인 필수 표현'을 이용해 주세요." };
      }
      return mmTranslate(text, from, to);
    }

    async function translateWithAutoDetect(text, targetLang = 'ko') {
      const r = await mmTranslate(text, 'autodetect', targetLang);
      return { ok: r.ok, translatedText: r.text, detectedLang: r.detectedLang || 'unknown' };
    }

    // ---------- 카메라 OCR ----------
    // OCR 잡음 줄(기호/짧은 조각)과 중복 줄을 제거해 번역 글자 수를 줄임
    function cleanOcrLines(raw) {
      const seen = new Set();
      return raw.split(/\r?\n/).map(l => l.replace(/\s+/g, ' ').trim()).filter(l => {
        const letters = (l.match(/\p{L}/gu) || []).length;
        if (letters < 3 || letters / l.length < 0.5) return false;
        const k = l.toLowerCase();
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
    }

    function makeChunks(lines) {
      const chunks = [];
      let cur = "";
      for (let line of lines) {
        while (line.length > CHUNK_LEN) {
          if (cur) { chunks.push(cur); cur = ""; }
          chunks.push(line.slice(0, CHUNK_LEN));
          line = line.slice(CHUNK_LEN);
        }
        if (cur && (cur.length + 1 + line.length) > CHUNK_LEN) { chunks.push(cur); cur = ""; }
        cur = cur ? cur + "\n" + line : line;
      }
      if (cur) chunks.push(cur);
      return chunks;
    }

    async function processImage(input) {
      if (!input.files || !input.files[0]) return;

      const file = input.files[0];
      const preview = document.getElementById('imagePreview');

      if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
      currentPreviewUrl = URL.createObjectURL(file);
      preview.src = currentPreviewUrl;
      preview.style.display = 'block';

      const status = document.getElementById('ocrStatus');
      const out = document.getElementById('ocrOutput');
      status.innerText = "⏳ 이미지에서 글자를 분석하는 중입니다...";
      showResult(out, "");

      // [수정] 선택한 언어만 인식 (더 빠르고 정확). 메뉴판 언어에 맞게 상단 언어 선택을 바꿔 주세요.
      const lang = document.getElementById('langSelect').value;
      const ocrLang = { es: 'spa', pt: 'por', en: 'eng' }[lang] || 'eng';

      let worker = null;
      try {
        worker = await Tesseract.createWorker(ocrLang);
        const ret = await worker.recognize(file);

        const lines = cleanOcrLines(ret.data.text || "");
        if (!lines.length) {
          status.innerText = "글자를 인식하지 못했습니다. 밝은 곳에서 다시 촬영해 주세요.";
          return;
        }

        let joined = lines.join("\n");
        let truncated = false;
        if (joined.length > MAX_OCR_CHARS) { joined = joined.slice(0, MAX_OCR_CHARS); truncated = true; }

        status.innerText = `추출된 원문(${joined.length}자): "${joined.replace(/\n/g, ' ')}"`;

        // [수정] 한 번에 보내지 않고 나눠서 번역, 한도 초과 시 중단하고 지금까지 결과는 표시
        const chunks = makeChunks(joined.split("\n"));
        const parts = [];
        let failure = null;
        for (let i = 0; i < chunks.length; i++) {
          const r = await mmTranslate(chunks[i], lang, 'ko');
          if (!r.ok) { failure = r; break; }
          parts.push(r.text);
          showResult(out, parts.join("\n"));
        }

        let note = "";
        if (truncated) note += `\n\n(글자가 많아 앞부분 ${MAX_OCR_CHARS}자만 번역했습니다.)`;
        if (failure) {
          if (parts.length) showResult(out, parts.join("\n") + note + "\n\n⚠️ " + failure.text);
          else showError(out, failure.text);
        } else {
          showResult(out, parts.join("\n") + note);
        }

      } catch (err) {
        status.innerText = "이미지 분석 중 오류가 발생했습니다.";
      } finally {
        if (worker) { try { await worker.terminate(); } catch (e) {} }
        input.value = "";
      }
    }

    // ---------- 음성 재생 ----------
    let voicesCache = [];
    let currentUtterance = null;   // 재생 중 가비지 컬렉션 방지
    let toastTimer = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.style.display = 'none'; }, 5000);
    }

    function loadVoices() {
      if ('speechSynthesis' in window) voicesCache = window.speechSynthesis.getVoices() || [];
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 버튼을 누른 순간(사용자 동작) 음성 엔진을 깨움: iOS 등은 비동기 번역 뒤에는 재생이 막힘
    function unlockSpeech() {
      if (!('speechSynthesis' in window)) return;
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function pickVoice(lang) {
      if (!voicesCache.length) loadVoices();
      const norm = v => v.lang.replace('_', '-').toLowerCase();
      const want = lang.toLowerCase();
      const base = want.split('-')[0];
      return voicesCache.find(v => norm(v) === want)
          || voicesCache.find(v => norm(v).split('-')[0] === base)
          || null;
    }

    function speak(text, lang) {
      if (!('speechSynthesis' in window)) {
        showToast("이 브라우저는 음성 재생을 지원하지 않습니다.");
        return;
      }
      const synth = window.speechSynthesis;
      synth.cancel();

      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.9;
      u.volume = 1;
      const voice = pickVoice(lang);
      if (voice) { u.voice = voice; u.lang = voice.lang; }
      else if (voicesCache.length) showToast(`기기에 ${lang} 음성이 없어 기본 음성으로 재생합니다.`);

      u.onerror = (e) => {
        if (e.error !== 'canceled' && e.error !== 'interrupted') {
          showToast(`음성 재생 오류(${e.error}). 무음 모드/미디어 볼륨을 확인해 주세요.`);
        }
      };
      currentUtterance = u;

      // cancel() 직후 바로 speak()하면 일부 브라우저(Android Chrome)에서 무음이 되는 문제 회피
      setTimeout(() => { synth.resume(); synth.speak(u); }, 120);
    }

    function replayMySpeech() { if (lastMyTranslated) speak(lastMyTranslated, lastMyLang); }
    function replayTargetSpeech() { if (lastTargetTranslated) speak(lastTargetTranslated, 'ko-KR'); }

    function playPhrase(korText) {
      const targetLang = document.getElementById('langSelect').value;
      const translated = (offlineDict[targetLang] && offlineDict[targetLang][korText]) || korText;

      lastMyTranslated = translated;
      lastMyLang = langMap[targetLang];

      document.getElementById('myInput').innerText = `나: "${korText}"`;
      showResult(document.getElementById('myOutput'), translated);
      document.getElementById('myActionBar').style.display = "flex";

      speak(translated, lastMyLang);
    }
  </script>
</body>
</html>
